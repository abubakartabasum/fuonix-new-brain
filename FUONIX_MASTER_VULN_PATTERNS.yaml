    description: "printf() with user-controlled format string — read arbitrary memory or write stack values."
    remediation: "Always use: printf(\"%s\", user_input) — never printf(user_input)."

  - id: BOF-005
    name: "Integer overflow before malloc"
    cwe: 190
    severity: HIGH
    languages: [c, cpp]
    regex: '(?i)malloc\s*\(\s*\w+\s*\*\s*sizeof'
    context_require: []
    context_reject: []
    fp_conditions: ["Multiplication result checked for overflow before malloc call"]
    description: "malloc(n * sizeof(T)) — integer overflow in multiplication wraps to small allocation, then heap overflow on write."
    remediation: "Use calloc(n, sizeof(T)) which handles overflow. Or check: if (n > SIZE_MAX / sizeof(T)) abort();"

  - id: BOF-006
    name: "Use after free"
    cwe: 416
