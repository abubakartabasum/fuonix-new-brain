    severity: MEDIUM
    languages: [python, javascript, java, php, ruby, go]
    regex: '(?i)(?:DEBUG\s*=\s*True|debug:\s*true|APP_DEBUG\s*=\s*true|development.*?mode)\s*(?!.*?(?:env|environ|getenv|process\.env))'
    context_require: []
    context_reject: ["os.environ", "process.env", "getenv", "ENV[", "config/development", ".env.dev"]
    fp_conditions: ["Value is loaded from environment variable (not hardcoded)"]
    description: "Debug mode hardcoded to enabled — may expose stack traces, configs, and debug endpoints in production."
    remediation: "Load from environment: DEBUG = os.environ.get('DEBUG', 'False') == 'True'. Never hardcode True."

  - id: MISCONFIG-002
    name: "CORS allow all origins"
    cwe: 16
    severity: HIGH
    languages: [python, javascript, java, php, ruby, go]
    regex: '(?i)(?:Access-Control-Allow-Origin|allow_origins|cors_origins)\s*[=:]+\s*["\']?\*["\']?'
    context_require: []
    context_reject: ["credentials.*false", "# public api"]
    fp_conditions: ["API is fully public with no authentication — CORS * is acceptable"]
    description: "CORS wildcard allows any origin to make cross-origin requests — combined with credentials enables CSRF-like attacks."
    remediation: "Specify explicit origin allowlist. Never use * with credentials: true. Use environment-based origin config."

  - id: MISCONFIG-003
    name: "Security headers missing (X-Frame-Options, CSP, etc.)"
    cwe: 16
    severity: LOW
    languages: [python, javascript, java, php, ruby, go]
    regex: '(?i)(?:X-Frame-Options|Content-Security-Policy|X-Content-Type-Options|Strict-Transport-Security)\s*.*?(?:ALLOW|allow-from\s*\*)'
    context_require: []
    context_reject: []
    fp_conditions: []
    description: "Permissive or missing security headers — enables clickjacking, MIME sniffing, or protocol downgrade."
    remediation: "Set: X-Frame-Options: DENY, X-Content-Type-Options: nosniff, HSTS with includeSubDomains, CSP policy."

  - id: MISCONFIG-004
    name: "Server version disclosure"
    cwe: 200
    severity: LOW
    languages: [python, javascript, java, php, ruby, go]
    regex: '(?i)(?:Server|X-Powered-By|X-AspNet-Version)\s*:\s*(?:Apache|nginx|IIS|Express|PHP|Tomcat|Jetty)'
    context_require: []
    context_reject: []
    fp_conditions: []
    description: "Server technology and version disclosed in response headers — aids fingerprinting."
    remediation: "Remove or neutralize Server and X-Powered-By headers in web server and framework config."

  - id: MISCONFIG-005
    name: "Overly permissive file upload"
    cwe: 434
    severity: HIGH
    languages: [python, javascript, php, java, ruby, go]
    regex: '(?i)(?:upload|file_upload|multipart).*?(?!.*?(?:mimetype|content_type|extension|whitelist|allowedTypes))'
    context_require: ["save", "write", "store", "upload"]
    context_reject: ["allowedExtensions", "whitelist", "mimeType", "content_type", "magic_bytes"]
    fp_conditions: ["File type validated by magic bytes and content-type with strict allowlist"]
    description: "File upload handler with no visible content-type or extension validation."
    remediation: "Validate magic bytes (not just MIME type), enforce extension allowlist, store outside webroot, rename on save."

  - id: MISCONFIG-006
    name: "HTTP used instead of HTTPS for sensitive operations"
    cwe: 319
    severity: HIGH
    languages: [all]
    regex: '(?i)http://(?!localhost|127\.0\.0\.1|0\.0\.0\.0).*?(?:login|auth|password|payment|checkout|account|admin|api)'
    context_require: []
    context_reject: []
    fp_conditions: ["In test/development environment only"]
    description: "Sensitive endpoint using HTTP — credentials and data transmitted in plaintext."
    remediation: "Enforce HTTPS for all endpoints. Redirect HTTP to HTTPS. Set HSTS header."

  - id: MISCONFIG-007
    name: "Cookie without HttpOnly or Secure flag"
    cwe: 614
    severity: MEDIUM
    languages: [python, javascript, php, java, ruby, go]
    regex: '(?i)(?:Set-Cookie|set_cookie|response\.cookie|setCookie)\s*.*?(?:session|auth|token|login)'
    context_require: []
    context_reject: ["HttpOnly", "httponly", "Secure", "secure"]
    fp_conditions: []
    description: "Session or auth cookie set without HttpOnly and Secure flags — accessible to JS and sent over HTTP."
    remediation: "Always set HttpOnly and Secure on session cookies. Add SameSite=Strict for CSRF protection."

  - id: MISCONFIG-008
    name: "Mass assignment — model accepts all params"
    cwe: 915
    severity: HIGH
    languages: [ruby, php, python, javascript, java]
    regex: '(?i)(?:\.fill\s*\(\s*\$request->all\(\)|params\.permit!|update_attributes\s*\(params\[|update\s*\(request\.POST\))'
    context_require: []
    context_reject: ["permit(:", "fillable", "strong_parameters"]
    fp_conditions: []
    description: "Mass assignment with unfiltered user input — allows setting protected fields like role, admin, balance."
    remediation: "Define explicit field allowlists. Rails: params.require(:user).permit(:name, :email). Laravel: $fillable array."

# ═══════════════════════════════════════════════════════════════════════════════
# FUONIX SCR — MASTER VULNERABILITY DETECTION PATTERNS
# Part 4 of 4: Prototype Pollution · ReDoS · GraphQL · Dependency · Supply Chain ·
#              Business Logic · Mobile · Cloud · API · Prototype & Advanced
