    fp_conditions: []
    description: "PHP variable variable where the variable name comes from user input — arbitrary variable manipulation."
    remediation: "Avoid variable variables. Access specific named variables or use arrays with explicit keys."

  - id: ADV-005
    name: "Python __import__ or importlib with user input"
    cwe: 95
    severity: CRITICAL
    languages: [python]
    regex: '(?i)(?:__import__|importlib\.import_module)\s*\(\s*(?![\"\'][a-zA-Z_][a-zA-Z0-9_.]*[\"\'])'
    context_require: ["request", "param", "input", "user", "data", "body"]
    context_reject: []
    fp_conditions: []
    description: "Dynamic module import with user-controlled module name — arbitrary code execution."
    remediation: "Use an allowlist of permitted module names. Never allow user input to determine what module is imported."

  - id: ADV-006
    name: "Django ORM filter with annotate and user expression"
    cwe: 89
    severity: HIGH
    languages: [python]
    regex: '(?i)\.annotate\s*\([^)]*(?:RawSQL|Func)\s*\([^)]*(?:request|param|user|input|data)'
    context_require: []
    context_reject: []
    fp_conditions: []
    description: "Django annotate() with RawSQL or Func using user input — SQL injection bypassing ORM."
    remediation: "Use only parameterized RawSQL: RawSQL('field + %s', [user_value]). Never format user input into RawSQL."

  - id: ADV-007
    name: "Ruby YAML.load with user input (Psych)"
    cwe: 502
    severity: CRITICAL
    languages: [ruby]
    regex: '(?i)YAML\.(?:load|parse)\s*\(\s*(?:params|request|gets|ARGV|user_input|IO\.read)'
    context_require: []
    context_reject: ["safe_load", "permitted_classes"]
    fp_conditions: []
    description: "Ruby YAML.load() with user input — loads arbitrary Ruby objects including exploit gadgets."
    remediation: "Use YAML.safe_load() which only allows basic types. In Psych 4+ use permitted_classes."

  - id: ADV-008
    name: "Node.js child_process.fork with user module"
    cwe: 78
    severity: CRITICAL
    languages: [javascript]
    regex: '(?i)child_process\.fork\s*\([^)]*(?:req\.|request\.|params\.|query\.|body\.)'
    context_require: []
    context_reject: []
    fp_conditions: []
    description: "child_process.fork() loading user-controlled module path — arbitrary code execution."
    remediation: "Never use user input as a module path to fork(). Use allowlist of permitted worker scripts."

  - id: ADV-009
    name: "Java JNDI lookup with user input (Log4Shell pattern)"
    cwe: 917
    severity: CRITICAL
    languages: [java]
    regex: '(?i)(?:InitialContext|JndiLookup|lookup)\s*\(\s*(?![\"\'][a-zA-Z]+://[a-zA-Z0-9./]+[\"\'])\w'
    context_require: ["request", "getParameter", "getHeader", "input", "user", "log"]
    context_reject: []
    fp_conditions: []
    description: "JNDI lookup with user-controlled name — enables Log4Shell-style RCE via LDAP/RMI."
    remediation: "Never perform JNDI lookups with user-supplied strings. Upgrade Log4j to >= 2.17.1. Set log4j2.formatMsgNoLookups=true."

  - id: ADV-010
    name: "Go template execution with user-defined template"
    cwe: 94
    severity: CRITICAL
    languages: [go]
    regex: '(?i)template\.(?:New|Must)\s*\([^)]*\).*?Parse\s*\([^)]*(?:r\.|req\.|request\.|user|input|param)'
    context_require: []
    context_reject: []
    fp_conditions: []
    description: "Go template parsed from user-controlled string — SSTI leads to arbitrary Go code execution."
    remediation: "Never parse user input as a Go template. Load templates from embedded files only."

  - id: ADV-011
    name: "Server-side include (SSI) injection"
    cwe: 97
    severity: HIGH
    languages: [php, java, python]
    regex: '(?i)<!--#(?:include|exec|echo|set|if)\s+(?:virtual|cmd|file|var)\s*='
    context_require: []
    context_reject: []
    fp_conditions: []
    description: "Server-Side Include directives in user-controlled content — file inclusion or command execution."
    remediation: "Disable SSI in web server config. Sanitize content that may be rendered as HTML to strip <!-- --> directives."

  - id: ADV-012
    name: "Unvalidated webhook payload"
    cwe: 345
    severity: HIGH
    languages: [javascript, python, ruby, java, php]
    regex: '(?i)(?:webhook|hook)\s*.*?(?:body|payload|data)\s*.*?(?!.*?(?:signature|hmac|verify|secret|x-hub-signature|x-signature))'
    context_require: ["POST", "receive", "handler", "endpoint"]
    context_reject: ["verify", "signature", "hmac", "secret"]
    fp_conditions: ["Webhook payload signature verified using HMAC before processing"]
    description: "Webhook handler processing payload without verifying HMAC signature — spoofed events."
    remediation: "Verify webhook signatures: compute HMAC-SHA256 of body with shared secret, compare to header using timing-safe comparison."

  - id: ADV-013
    name: "Python Flask session without secret key"
    cwe: 521
    severity: HIGH
    languages: [python]
    regex: '(?i)app\.secret_key\s*=\s*["\'][^"\']{1,15}["\']'
    context_require: []
    context_reject: ["os.environ", "os.urandom", "secrets."]
    fp_conditions: []
    description: "Flask application with a short or hardcoded secret key — session cookies can be forged."
    remediation: "Set app.secret_key = secrets.token_hex(32) loaded from environment. Minimum 32 random bytes."

  - id: ADV-014
    name: "Express session secret hardcoded or weak"
    cwe: 521
    languages: [javascript]
    severity: HIGH
    regex: '(?i)session\s*\(\s*\{[^}]*secret\s*:\s*["\'][^"\']{1,16}["\']'
    context_require: []
    context_reject: ["process.env"]
    fp_conditions: []
    description: "Express-session with short or hardcoded secret — session tokens forgeable."
    remediation: "Use a 64-char random secret from environment: secret: process.env.SESSION_SECRET"

  - id: ADV-015
    name: "Recursive JSON parsing without depth limit"
    cwe: 674
    severity: MEDIUM
    languages: [javascript, python, java, go]
    regex: '(?i)JSON\.parse\s*\(\s*(?:req\.|request\.|body\.|data\.).*?(?!.*?(?:maxDepth|limit|maxSize|length))'
    context_require: []
    context_reject: []
    fp_conditions: ["Input size bounded before parsing"]
    description: "JSON parsing of user-controlled input without size or depth limits — JSON bomb DoS."
    remediation: "Set Content-Length limits in web server. Use JSON parsers with configurable depth limits."

  - id: ADV-016
    name: "XML bomb (Billion Laughs DoS)"
    cwe: 776
    severity: HIGH
    languages: [python, java, php, javascript, ruby]
    regex: '(?i)<!ENTITY\s+\w+\s+["\'][^"\']+["\']>.*?<!ENTITY\s+\w+\s+["\'](?:&\w+;){2,}'
    context_require: []
    context_reject: []
    fp_conditions: []
    description: "XML entity expansion attack pattern (Billion Laughs) — exponential entity expansion causes DoS."
    remediation: "Disable entity expansion. Use defusedxml (Python), set FEATURE_SECURE_PROCESSING (Java)."

  - id: ADV-017
    name: "Insecure object comparison (PHP ==)"
    cwe: 697
    severity: HIGH
    languages: [php]
    regex: '(?i)(?:if|while|switch)\s*\(\s*(?:md5|sha1|hash)\s*\([^)]+\)\s*==\s*["\'][0-9a-f]+["\']'
    context_require: []
    context_reject: ["==="]
    fp_conditions: []
    description: "PHP hash compared with == — type juggling allows '0e...' magic hash collision bypass."
    remediation: "Always use === and hash_equals() for hash comparisons: if (hash_equals($expected, $actual))"

  - id: ADV-018
    name: "Server-side PDF/image generation with user HTML (SSRF/RCE)"
    cwe: 918
    severity: HIGH
    languages: [python, javascript, ruby, php, java]
    regex: '(?i)(?:wkhtmltopdf|puppeteer|phantom|headless|html2pdf|chromium)\s*.*?(?:req\.|request\.|params\.|user\.|input\.|body\.)'
    context_require: []
    context_reject: ["sanitize", "DOMPurify", "escape"]
    fp_conditions: []
    description: "Headless browser or PDF generator rendering user-controlled HTML — SSRF via <iframe src>, file:// access, or script execution."
    remediation: "Sanitize HTML before rendering. Disable JavaScript in headless browser. Block file:// and internal URLs."

  - id: ADV-019
    name: "Unsafe reflection — Java class.forName with user input"
    cwe: 470
    severity: HIGH
    languages: [java]
    regex: '(?i)Class\.forName\s*\(\s*(?![\"\'][a-zA-Z][a-zA-Z0-9.]+["\'])'
    context_require: ["request", "getParameter", "getHeader", "user", "input", "param"]
    context_reject: []
    fp_conditions: []
    description: "Java Class.forName() with user-controlled class name — arbitrary class loading, potential RCE."
    remediation: "Use an allowlist of permitted class names. Never allow user input to determine which class is loaded."

  - id: ADV-020
    name: "Nginx alias misconfiguration (path traversal)"
    cwe: 22
    severity: HIGH
    languages: [nginx]
    regex: '(?i)location\s+(/\w+)\s*\{[^}]*alias\s+[^;]+(?<!/);'
    context_require: []
    context_reject: []
    fp_conditions: ["Location block ends with / AND alias directive ends with / (matching trailing slash)"]
    description: "Nginx alias without trailing slash when location has trailing slash — off-by-one path traversal (CVE class)."
    remediation: "Ensure both location and alias end with / or neither does: location /files/ { alias /data/files/; }"

# ───────────────────────────────────────────────────────────────
# SUPPRESSION INDEX — PATTERNS TO NEVER FLAG
# ───────────────────────────────────────────────────────────────
# These are commonly matched but should never be reported as vulnerabilities.
# Any pattern matching these should be automatically suppressed.

suppression_rules:
  - id: SUPPRESS-001
    reason: "Test/mock files — lower severity but don't suppress entirely"
    path_patterns: ["/test/", "/spec/", "/mock/", "/__tests__/", ".test.js", ".spec.py", "/fixtures/"]

  - id: SUPPRESS-002
    reason: "Documentation and example files"
    path_patterns: ["/docs/", "/examples/", "/samples/", "README", "CHANGELOG", ".md"]

  - id: SUPPRESS-003
    reason: "Placeholder/example secrets"
    value_patterns: ["changeme", "your-secret-here", "xxx", "TODO", "PLACEHOLDER", "example", "dummy", "INSERT_HERE", "replace_me", "your_api_key", "EXAMPLEKEY"]

  - id: SUPPRESS-004
    reason: "ORM parameterized interfaces"
    code_patterns: ["cursor.execute('...', (", 'PreparedStatement', 'setParameter(', 'bindParam(', '.where(column:', '.find_by(']

  - id: SUPPRESS-005
    reason: "Known safe output encoders"
    code_patterns: ["DOMPurify.sanitize(", "htmlspecialchars($v, ENT_QUOTES", "OWASP Encoder", "bleach.clean(", "he.escape("]

